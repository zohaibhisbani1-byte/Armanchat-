<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArmanChat WebRTC Call</title>
  <style>
    body {
      margin: 0;
      background: #075E54;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    #stage {
      position: relative;
      flex: 1;
      background: #0B141A;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #remoteVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #localVideo {
      position: absolute;
      right: 12px;
      bottom: 12px;
      width: 110px;
      height: 150px;
      border-radius: 12px;
      border: 2px solid #25D366;
      object-fit: cover;
      background: #1F2C34;
    }
    #statusBar {
      padding: 10px 14px;
      background: #075E54;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div id="statusBar">
    <span id="callTitle">ArmanChat Encrypted Call</span>
    <span id="connState">Connecting...</span>
  </div>
  <div id="stage">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
  </div>

  <script>
    (function () {
      const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      const callId = hash.get('callId');
      const role = hash.get('role');
      const callType = hash.get('callType') || 'audio';
      const dbUrl = (hash.get('dbUrl') || '').replace(/\/$/, '');
      const token = hash.get('token') || '';
      const turnUrl = hash.get('turnUrl');
      const turnUser = hash.get('turnUser');
      const turnPass = hash.get('turnPass');

      const statusEl = document.getElementById('connState');
      const remoteVideo = document.getElementById('remoteVideo');
      const localVideo = document.getElementById('localVideo');

      const iceServers = [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ];
      if (turnUrl) {
        iceServers.push({
          urls: turnUrl,
          username: turnUser || '',
          credential: turnPass || ''
        });
      }

      let localStream = null;
      let pc = null;
      const seenCandidates = new Set();

      function rtdbUrl(path) {
        return `${dbUrl}/calls/${callId}/${path}.json?auth=${encodeURIComponent(token)}`;
      }

      window.armanSetMic = function (enabled) {
        if (localStream) {
          localStream.getAudioTracks().forEach(t => { t.enabled = !!enabled; });
        }
      };

      window.armanSetCam = function (enabled) {
        if (localStream) {
          localStream.getVideoTracks().forEach(t => { t.enabled = !!enabled; });
        }
      };

      async function pushCandidate(side, candidate) {
        await fetch(rtdbUrl(`candidates_${side}`), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(candidate.toJSON())
        });
      }

      async function start() {
        if (!callId || !dbUrl) {
          statusEl.textContent = 'Missing signaling config';
          return;
        }
        try {
          localStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: callType === 'video'
          });
          localVideo.srcObject = localStream;
          if (callType !== 'video') {
            localVideo.style.display = 'none';
          }

          pc = new RTCPeerConnection({ iceServers });
          localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

          pc.ontrack = (event) => {
            if (event.streams && event.streams[0]) {
              remoteVideo.srcObject = event.streams[0];
              statusEl.textContent = 'Connected';
            }
          };

          pc.oniceconnectionstatechange = () => {
            statusEl.textContent = pc.iceConnectionState;
          };

          pc.onicecandidate = (event) => {
            if (event.candidate) {
              pushCandidate(role, event.candidate);
            }
          };

          if (role === 'caller') {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            await fetch(rtdbUrl('offer'), {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ type: offer.type, sdp: offer.sdp })
            });
          } else {
            // Wait for caller offer
            let offer = null;
            for (let i = 0; i < 30; i++) {
              const r = await fetch(rtdbUrl('offer'));
              offer = await r.json();
              if (offer && offer.sdp) break;
              await new Promise(res => setTimeout(res, 1000));
            }
            if (offer && offer.sdp) {
              await pc.setRemoteDescription(new RTCSessionDescription(offer));
              const answer = await pc.createAnswer();
              await pc.setLocalDescription(answer);
              await fetch(rtdbUrl('answer'), {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type: answer.type, sdp: answer.sdp })
              });
            }
          }

          const remoteSide = role === 'caller' ? 'callee' : 'caller';
          setInterval(async () => {
            try {
              if (role === 'caller' && !pc.currentRemoteDescription) {
                const ar = await fetch(rtdbUrl('answer'));
                const ans = await ar.json();
                if (ans && ans.sdp) {
                  await pc.setRemoteDescription(new RTCSessionDescription(ans));
                }
              }
              const cr = await fetch(rtdbUrl(`candidates_${remoteSide}`));
              const cands = await cr.json();
              if (cands && typeof cands === 'object') {
                for (const [key, cand] of Object.entries(cands)) {
                  if (!seenCandidates.has(key) && cand && cand.candidate) {
                    seenCandidates.add(key);
                    await pc.addIceCandidate(new RTCIceCandidate(cand));
                  }
                }
              }
            } catch (e) {
              // Retry next poll cycle
            }
          }, 1500);
        } catch (err) {
          statusEl.textContent = 'Media permission error: ' + err.message;
        }
      }

      start();
    })();
  </script>
</body>
</html>
